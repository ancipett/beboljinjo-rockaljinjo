<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" width="100%" height="100%">
    <defs>
        <!-- GTA VI Vice City Neon Sunset Gradient for '25' -->
        <linearGradient id="gta-vi-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2a62f8"/>
            <stop offset="25%" stop-color="#6933e3"/>
            <stop offset="55%" stop-color="#ff007f"/>
            <stop offset="82%" stop-color="#ff5500"/>
            <stop offset="100%" stop-color="#ffb700"/>
        </linearGradient>

        <!-- Drop Shadow Filter for Depth -->
        <filter id="logo-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="10" dy="14" stdDeviation="6" flood-color="#000000" flood-opacity="0.85"/>
        </filter>

        <!-- Official GTA Pricedown Font -->
        <style>
            @font-face {
                font-family: 'PricedownGTA';
                src: url('https://db.onlinewebfonts.com/t/741e6c38827f8830722254e488d5e896.woff2') format('woff2'),
                     url('https://db.onlinewebfonts.com/t/741e6c38827f8830722254e488d5e896.ttf') format('truetype');
            }

            .bg-number {
                font-family: 'Impact', 'Arial Black', sans-serif;
                font-size: 630px;
                font-weight: 900;
                fill: url(#gta-vi-grad);
                stroke: #120024;
                stroke-width: 14px;
                paint-order: stroke fill;
                stroke-linejoin: round;
            }

            /* Clean Outer Dark GTA Outline (Reduced thickness for sharpness) */
            .gta-text-outer {
                font-family: 'PricedownGTA', 'Impact', sans-serif;
                font-size: 195px;
                fill: none;
                stroke: #12021c;
                stroke-width: 26px;
                stroke-linejoin: round;
                stroke-linecap: round;
                letter-spacing: -4px;
                text-transform: lowercase;
            }

            /* Crisp White Foreground Text */
            .gta-text-inner {
                font-family: 'PricedownGTA', 'Impact', sans-serif;
                font-size: 195px;
                fill: #ffffff;
                stroke: #250238;
                stroke-width: 8px;
                paint-order: stroke fill;
                stroke-linejoin: round;
                letter-spacing: -4px;
                text-transform: lowercase;
            }
        </style>
    </defs>

    <g filter="url(#logo-shadow)">
        <!-- Giant '25' Background (GTA VI Style) -->
        <text x="500" y="650" text-anchor="middle" class="bg-number">25</text>

        <!-- Outer Dark GTA Outline Layer for Overlapping Effect -->
        <g transform="translate(0, 0)">
            <text x="500" y="230" text-anchor="middle" class="gta-text-outer">sretan</text>
            <text x="500" y="380" text-anchor="middle" class="gta-text-outer">rockas</text>
            <text x="500" y="530" text-anchor="middle" class="gta-text-outer">deki</text>
        </g>

        <!-- Main White GTA Pricedown Text Layer -->
        <g transform="translate(0, 0)">
            <text x="500" y="230" text-anchor="middle" class="gta-text-inner">sretan</text>
            <text x="500" y="380" text-anchor="middle" class="gta-text-inner">rockas</text>
            <text x="500" y="530" text-anchor="middle" class="gta-text-inner">deki</text>
        </g>
    </g>
</svg>
